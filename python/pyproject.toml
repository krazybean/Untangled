# SPDX-License-Identifier: GPL-2.0-only

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "untangled"
dynamic = ["version"]
description = "Dependency health your whole team can understand: cycles and coupling in Python projects, in a report anyone can read."
readme = "README.md"
# The report's script and styles are MIT-licensed copies of php/resources/report.
license = "GPL-2.0-only AND MIT"
license-files = ["LICENSE", "src/untangled/report/assets/LICENSE.MIT"]
authors = [{ name = "Juan Castro" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["dependency-graph", "code-dependencies", "circular-dependencies", "import-graph", "module-dependencies", "coupling", "architecture", "static-analysis", "code-visualization", "dependency-health", "python"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/krazybean/Untangled"
Documentation = "https://github.com/krazybean/Untangled/blob/main/python/README.md"
Examples = "https://github.com/krazybean/Untangled/blob/main/EXAMPLES.md"
Issues = "https://github.com/krazybean/Untangled/issues"
Changelog = "https://github.com/krazybean/Untangled/blob/main/python/CHANGELOG.md"

[project.scripts]
untangled = "untangled.cli:main"
utg = "untangled.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.dynamic]
version = { attr = "untangled.version.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"untangled.report" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

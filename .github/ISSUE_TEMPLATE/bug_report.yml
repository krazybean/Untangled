# SPDX-License-Identifier: MIT
name: Bug report
description: A wrong dependency, a crash, a wrong number or a broken report.
labels: [bug]
body:
  - type: dropdown
    id: library
    attributes:
      label: Library
      options:
        - PHP
        - Python
        - JavaScript / TypeScript
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `untangled --version`.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and OS
      placeholder: PHP 8.3 on macOS 15 / Python 3.12 on Ubuntu 24.04 / Node.js 24 on Windows 11
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The full command you ran.
      render: sh
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: >
        For a missing or wrong dependency, name the file and the import or
        class it should resolve to. Paste any error or warning output.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: A project that shows it
      description: >
        A link to a public repository, or the smallest set of files that
        reproduces the problem. Please don't paste private code.

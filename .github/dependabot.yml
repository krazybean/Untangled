# SPDX-License-Identifier: MIT
# One entry per language folder, each in its own ecosystem.
version: 2
updates:
  - package-ecosystem: composer
    directory: /php
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

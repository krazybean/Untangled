# SPDX-License-Identifier: MIT
# One entry per language folder, each in its own ecosystem. Add npm for
# typescript/ and pip for python/ once they declare dependencies.
version: 2
updates:
  - package-ecosystem: composer
    directory: /php
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

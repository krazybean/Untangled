# SPDX-License-Identifier: MIT
# The Python library's own CI. It runs inside python/ with pip only.
name: Python

on:
  pull_request:
    paths: ['python/**', 'conformance/**', 'spec/**', '.github/workflows/python.yml']
  push:
    branches: [main]
    paths: ['python/**', 'conformance/**', 'spec/**', '.github/workflows/python.yml']

defaults:
  run:
    working-directory: python

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Dependency groups (pyproject.toml [dependency-groups]) need pip 25.1 or newer.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

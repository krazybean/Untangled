# SPDX-License-Identifier: MIT
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-licenses.sh

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer validate --no-check-publish --strict --working-dir php
      - run: composer install --no-interaction --no-progress --working-dir php
      - run: php -d zend.assertions=1 -d assert.exception=1 php/tests/run.php

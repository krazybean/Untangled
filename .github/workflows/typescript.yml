# SPDX-License-Identifier: MIT
# The JavaScript/TypeScript library's own CI. It runs inside typescript/ with npm only.
name: TypeScript

on:
  pull_request:
    paths: ['typescript/**', 'conformance/**', 'spec/**', 'php/resources/report/**', '.github/workflows/typescript.yml']
  push:
    branches: [main]
    paths: ['typescript/**', 'conformance/**', 'spec/**', 'php/resources/report/**', '.github/workflows/typescript.yml']

defaults:
  run:
    working-directory: typescript

jobs:
  typescript:
    name: Node ${{ matrix.node }}${{ matrix.os == 'windows-latest' && ' on Windows' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24']
        include:
          - { os: windows-latest, node: '24' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      # npm ci runs the prepare script, which builds dist/ for bin/untangled.js.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node bin/untangled.js scan ../conformance/cases/three-cycle/typescript/project
      # Install the packed tarball the way users will, so a file missing from
      # the package fails here rather than for them.
      - name: Test the packed package
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/install" && cd "$RUNNER_TEMP/install"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/krazybean-untangled-*.tgz
          npx untangled --version
          npx utg report "$GITHUB_WORKSPACE/conformance/cases/three-cycle/typescript/project" --output=report.html
          grep -q '<svg\|<html' report.html

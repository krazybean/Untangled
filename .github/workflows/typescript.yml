# SPDX-License-Identifier: MIT
# The JavaScript/TypeScript library's own CI. It runs inside typescript/ with npm only.
name: TypeScript

on:
  pull_request:
    paths: ['typescript/**', 'conformance/**', 'spec/**', '.github/workflows/typescript.yml']
  push:
    branches: [main]
    paths: ['typescript/**', 'conformance/**', 'spec/**', '.github/workflows/typescript.yml']

defaults:
  run:
    working-directory: typescript

jobs:
  typescript:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      # npm ci runs the prepare script, which builds dist/ for bin/untangled.js.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node bin/untangled.js scan ../conformance/cases/three-cycle/typescript/project

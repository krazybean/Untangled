# SPDX-License-Identifier: MIT
# Publishes the Python library to PyPI when a python/vX.Y.Z tag is pushed.
# A pre-release tag (python/v1.1.0rc1) goes to TestPyPI instead. Uploads use
# PyPI trusted publishing, so no token is stored: see docs/releasing.md.
name: Python release

on:
  push:
    tags: ['python/v*']

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  release:
    name: Build, check and publish
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, 'rc') && 'testpypi' || 'pypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check the tag matches the version
        run: |
          tag=${GITHUB_REF_NAME#python/v}
          version=$(PYTHONPATH=src python -c 'from untangled.version import VERSION; print(VERSION)')
          if [[ $tag != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match python/src/untangled/version.py ($version)"
            exit 1
          fi
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      # The tests run against the built wheel, not the checkout, so a file
      # missing from the package fails here rather than for users.
      - name: Test the wheel
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install dist/*.whl pytest
          /tmp/wheel/bin/python -m pytest -p no:cacheprovider
          /tmp/wheel/bin/untangled report ../conformance/cases/layers/python/project --output=/tmp/report.html
      - name: Publish to TestPyPI
        if: contains(github.ref_name, 'rc')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: ${{ !contains(github.ref_name, 'rc') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
